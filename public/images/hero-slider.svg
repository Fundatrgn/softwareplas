<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900">
  <rect width="1000" height="900" fill="#1B1F1C"/>

  <!-- soft background washes -->
  <circle cx="820" cy="180" r="220" fill="#7FA36F" opacity="0.14"/>
  <circle cx="120" cy="720" r="260" fill="#D9784B" opacity="0.10"/>

  <!-- large calming halo behind the growth motif -->
  <circle cx="500" cy="470" r="270" fill="none" stroke="#D9784B" stroke-width="2" opacity="0.35"/>
  <circle cx="500" cy="470" r="330" fill="none" stroke="#7FA36F" stroke-width="2" opacity="0.28"/>

  <!-- ground line -->
  <line x1="270" y1="640" x2="730" y2="640" stroke="#4A463C" stroke-width="3" opacity="0.7"/>

  <!-- growing plant motif: symbolizes personal growth / new beginnings -->
  <g stroke="#D9784B" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M500 640 C 500 560 500 500 500 430"/>
    <path d="M500 560 C 460 530 420 520 385 535"/>
    <path d="M500 500 C 545 470 585 465 620 480"/>
    <path d="M500 460 C 468 430 445 415 415 415"/>
  </g>
  <g fill="#7FA36F">
    <ellipse cx="385" cy="535" rx="46" ry="26" transform="rotate(-18 385 535)"/>
    <ellipse cx="620" cy="480" rx="50" ry="27" transform="rotate(14 620 480)"/>
    <ellipse cx="415" cy="415" rx="40" ry="22" transform="rotate(-30 415 415)"/>
  </g>
  <circle cx="500" cy="415" r="20" fill="#D9784B"/>

  <!-- small orbiting dots for a gentle, alive feel -->
  <circle cx="330" cy="360" r="7" fill="#D9784B" opacity="0.5"/>
  <circle cx="690" cy="620" r="8" fill="#7FA36F" opacity="0.6"/>
  <circle cx="640" cy="330" r="5" fill="#D9784B" opacity="0.4"/>
</svg>
